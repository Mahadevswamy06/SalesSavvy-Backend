spring.application.name=salessavvy
server.port=${PORT:${SERVER_PORT:9090}}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Razorpay
razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}

# Frontend
frontend.origin=${FRONTEND_ORIGIN}

# Cookies
cookie.secure=${COOKIE_SECURE}
cookie.same-site=${COOKIE_SAME_SITE}

# CORS
spring.web.cors.allowed-origins=${FRONTEND_ORIGIN}
spring.web.cors.exposed-headers=*
spring.web.cors.max-age=36000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization
spring.web.cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO


# Startup diagnostics
logging.level.org.springframework.boot=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
